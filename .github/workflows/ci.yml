name: CI / CD Workflow - SIKAP FKP UNRI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, gd, zip, curl, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Security Vulnerability Audit (Composer Audit)
        run: composer audit

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Verify Laravel Configuration & Syntax
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php artisan route:clear

      - name: Code Quality & Style Check (Laravel Pint)
        run: ./vendor/bin/pint --test --dirty

      - name: Run Automated Test Suite
        env:
          APP_ENV: testing
          APP_KEY: ${{ secrets.CI_APP_KEY || 'base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=' }}
          DEPLOY_WEBHOOK_KEY: ${{ secrets.DEPLOY_WEBHOOK_KEY || 'test_ci_mock_deploy_secret_key' }}
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
