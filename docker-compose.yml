# =============================================================================# Docker Compose - SIMPEG-APP Local Server# Dibuat untuk: PC Lokal Windows 11 + Tailscale VPN# =============================================================================services:  # ---------------------------------------------------------------------------  # DATABASE: MySQL 8  # ---------------------------------------------------------------------------  db:    image: mysql:8.0    container_name: simpeg-db    restart: always    environment:      MYSQL_ROOT_PASSWORD: rootpassword_simpeg_2024      MYSQL_DATABASE: simpeg      MYSQL_USER: simpeg_user      MYSQL_PASSWORD: simpeg_pass_lokal_2024    volumes:      - mysql_data:/var/lib/mysql      - ./docker/mysql/init:/docker-entrypoint-initdb.d    ports:      - "3306:3306"    networks:      - simpeg-network    healthcheck:      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword_simpeg_2024"]      interval: 10s      timeout: 5s      retries: 5      start_period: 30s  # ---------------------------------------------------------------------------  # APLIKASI: Laravel + Nginx + PHP-FPM  # ---------------------------------------------------------------------------  app:    build:      context: .      dockerfile: Dockerfile    container_name: simpeg-app    restart: always    depends_on:      db:        condition: service_healthy    environment:      APP_NAME: "SIKAP"      APP_ENV: production      APP_DEBUG: "false"      APP_URL: "http://localhost"      APP_LOCALE: id      APP_FALLBACK_LOCALE: en      APP_FAKER_LOCALE: id_ID      APP_MAINTENANCE_DRIVER: file      BCRYPT_ROUNDS: "12"      LOG_CHANNEL: stack      LOG_STACK: single      LOG_LEVEL: error      DB_CONNECTION: mysql      DB_HOST: db      DB_PORT: "3306"      DB_DATABASE: simpeg      DB_USERNAME: simpeg_user      DB_PASSWORD: simpeg_pass_lokal_2024      SESSION_DRIVER: database      SESSION_LIFETIME: "120"      BROADCAST_CONNECTION: log      FILESYSTEM_DISK: public      QUEUE_CONNECTION: database      CACHE_STORE: database    ports:      - "8080:80"    volumes:      - app_storage:/var/www/storage/app/public      - app_logs:/var/www/storage/logs    networks:      - simpeg-network# -----------------------------------------------------------------------------# VOLUMES: Data Persisten (tidak hilang saat container restart)# -----------------------------------------------------------------------------volumes:  mysql_data:    driver: local  app_storage:    driver: local  app_logs:    driver: local# -----------------------------------------------------------------------------# NETWORKS# -----------------------------------------------------------------------------networks:  simpeg-network:    driver: bridge